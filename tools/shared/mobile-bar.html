<div class="mobile-cta">
        <a class="btn btn--outline btn--md" {{MOBILE_CALL_ATTRS}}>
            <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-phone"></use></svg>
            Call
        </a>
        <a class="btn btn--primary btn--md" href="{{BOOK_HREF}}">Book{{BOOK_SUFFIX}}</a>
    </div>

    <!-- Hoja inferior "Call a location" (móvil) / modal centrado (tablet+) -->
    <dialog class="call-sheet" id="call-sheet" aria-labelledby="call-sheet-title">
        <div class="call-sheet__inner">
            <div class="call-sheet__header">
                <h2 class="call-sheet__title" id="call-sheet-title">Call a location</h2>
                <button class="icon-btn call-sheet__close" type="button" aria-label="Close" data-call-sheet-close>
                    <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-close"></use></svg>
                </button>
            </div>
            <ul class="call-list">
                {{CALL_ITEMS_BLOCK}}
            </ul>
        </div>
    </dialog>
