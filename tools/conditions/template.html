<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- STAGING: quitar "noindex, nofollow" el día del lanzamiento (hay textos pendientes de confirmar) -->
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{TITLE}}</title>
    <meta name="description" content="{{DESC}}">
    <link rel="canonical" href="{{URL}}">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Pain Therapy Medical Care">
    <meta property="og:title" content="{{TITLE}}">
    <meta property="og:description" content="{{DESC}}">
    <meta property="og:url" content="{{URL}}">{{OG_IMAGE_TAGS}}
    <meta property="og:locale" content="en_US">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="icon" href="{{BASE}}assets/icons/paintherapy-isotype_1.svg" type="image/svg+xml">

    <!-- Marca "JS disponible" antes del primer pintado -->
    <script src="{{BASE}}assets/js/js-detect.js"></script>

    <!-- Fuentes: Montserrat (Gotham no es libre; se usa si está instalada) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{BASE}}styles.css">
    {{HEAD_SCRIPTS}}
    <script src="{{BASE}}assets/js/main.js" defer></script>{{PAGE_SCRIPTS}}

    <!--
        Datos estructurados ({{SCHEMA_NOTE}}).
        Las respuestas del FAQ del JSON-LD coinciden EXACTAMENTE con el texto visible.
    -->
    <script type="application/ld+json">
{{JSONLD}}
    </script>
</head>
<body>

    <!-- =====================================================
         SPRITE DE ÍCONOS
    ====================================================== -->
    {{SPRITE}}
{{LOCAL_SPRITE}}
    {{HEADER}}

    <main id="content" tabindex="-1">
{{CONFIRM_NOTE}}
{{MAIN}}

    </main>

    {{FOOTER}}

    {{MOBILE_AND_SHEET}}

</body>
</html>
